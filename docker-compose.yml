services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homelab}
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
    # Bind to loopback only so the database is reachable from the host (and the
    # api container via the internal network), never the wider LAN. Override
    # credentials via a .env file in any shared or production environment.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - homelab-db:/var/lib/postgresql/data

volumes:
  homelab-db:
